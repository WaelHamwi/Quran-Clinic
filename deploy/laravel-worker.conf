; Supervisor program for the Laravel queue worker (CompressAudioJob etc.).
; Copy to /etc/supervisor/conf.d/laravel-worker.conf, adjust paths/user, then:
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start laravel-worker:*
;
; Adjust `command` connection (database|redis) to match QUEUE_CONNECTION.

[program:laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/mashfa/app/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/mashfa/app/storage/logs/worker.log
stopwaitsecs=620
