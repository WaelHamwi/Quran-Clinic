server {
    server_name mashfa.odooclick.com;
    root /var/www/mashfa/app/public;
    index index.php index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;
    client_max_body_size 256M;

    # Compress API JSON and text assets (Arabic payloads shrink ~75%).
    # Audio (mp3) is already compressed — leave it out.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain text/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Internal-only: public recitations. App emits `X-Accel-Redirect: /__audio_internal/<path>`
    # (RecitationController::audio with AUDIO_X_ACCEL=true) so Nginx streams the file and the
    # PHP-FPM worker is freed immediately instead of being tied up for the whole listen.
    location /__audio_internal/ {
        internal;
        alias /var/www/mashfa/app/storage/app/public/;
        add_header Accept-Ranges bytes;
    }

    # Internal-only: gated premium recordings. App emits `X-Accel-Redirect: /__protected_audio/<path>`
    # ONLY after RecordingController::audio() passes the subscription check.
    location /__protected_audio/ {
        internal;
        alias /var/www/mashfa/app/storage/app/private/;
        add_header Accept-Ranges bytes;
    }

    # Belt-and-suspenders: the private recordings dir must never be web-served directly.
    location ~ ^/storage/recordings/ { return 404; }

    # Uploaded files: never execute anything under /storage, even if a script
    # ever slips past validation. Must appear before the generic \.php$ block
    # (nginx picks the first matching regex location).
    location ~* ^/storage/.*\.(php|phtml|phar|pl|py|cgi|sh)$ {
        deny all;
    }

    # SVGs can embed <script>; a CSP neutralizes it if one is opened directly.
    location ~* ^/storage/.*\.svg$ {
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "SAMEORIGIN";
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # Other static uploads (icons/photos/audio): let clients cache instead of
    # re-downloading on every screen visit.
    location ~* ^/storage/.*\.(png|jpe?g|webp|gif|ico|mp3|m4a|ogg)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mashfa.odooclick.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mashfa.odooclick.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = mashfa.odooclick.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name mashfa.odooclick.com;
    return 404; # managed by Certbot
}
